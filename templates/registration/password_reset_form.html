
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Angana's Kitchen</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #fff4e5, #f5d7b5, #e8c39e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #fffdf8;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(91, 49, 20, 0.18);
        }

        h1 {
            color: #75421f;
            text-align: center;
            font-size: 27px;
        }

        p {
            color: #96745b;
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            color: #58351f;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8c1a9;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #75421f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #a45d2a; }

        a {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #9a5527;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="card">

    <h1>Angana's Kitchen</h1>

    <h2 style="text-align:center; color:#58351f;">
        Forgot Your Password?
    </h2>

    <p>
        Don't worry! Enter your registered email address
        and we'll send you a password reset link.
    </p>

    <form method="POST">
        {% csrf_token %}

        <label>Email Address</label>

        <input type="email"
               name="email"
               placeholder="Enter your registered email"
               required>

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <a href="{% url 'customer_login' %}">
        Back to Login
    </a>

</div>
</body>
</html>
