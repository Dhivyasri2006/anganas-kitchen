
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | Angana's Kitchen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #fff4e5, #f5d7b5, #e8c39e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #fffdf8;
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(91, 49, 20, 0.18);
        }

        .icon {
            font-size: 55px;
        }

        h1 {
            color: #75421f;
        }

        p {
            color: #96745b;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #75421f;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }

        a:hover {
            background: #a45d2a;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">📧</div>

    <h1>Check Your Email!</h1>

    <p>
        If an account exists with the email address you entered,
        you will receive instructions to reset your password.
    </p>

    <p>
        Please check your inbox and spam folder.
    </p>

    <a href="{% url 'customer_login' %}">
        Back to Login
    </a>

</div>

</body>
</html>
